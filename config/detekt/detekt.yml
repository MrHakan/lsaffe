# DeckWatch detekt profile.
# buildUponDefaultConfig=true — this file only overrides the defaults.
# Style-only rules that fight Compose or dense seed content are relaxed;
# correctness rules stay at their defaults.

complexity:
  LongMethod:
    active: false
  LongParameterList:
    active: false
  LargeClass:
    active: false
  TooManyFunctions:
    active: false
  CyclomaticComplexMethod:
    active: false
  NestedBlockDepth:
    threshold: 6

naming:
  FunctionNaming:
    ignoreAnnotated: ['Composable']
  TopLevelPropertyNaming:
    active: false
  ConstructorParameterNaming:
    active: true

style:
  MagicNumber:
    active: false
  MaxLineLength:
    active: false
  WildcardImport:
    active: false
  ReturnCount:
    active: false
  UnusedPrivateMember:
    ignoreAnnotated: ['Preview']
  ThrowsCount:
    active: false
  LoopWithTooManyJumpStatements:
    active: false
  DestructuringDeclarationWithTooManyEntries:
    active: false

exceptions:
  TooGenericExceptionCaught:
    active: false
  SwallowedException:
    active: false

empty-blocks:
  EmptyFunctionBlock:
    ignoreOverridden: true
