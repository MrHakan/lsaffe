name: Bootstrap signing key

# Creates the app's release signing key once, on a runner, and writes it straight into this
# repository's own secrets. Run it from the Actions tab; it takes no files and needs no computer.
#
# Why this exists at all: until a stable key signs the release build, every APK is signed with a
# freshly generated debug keystore, and Android refuses to install one over the other. That is the
# "I have to uninstall the app to update it" symptom.
#
# The key never leaves GitHub. It is generated here, stored as a secret here, and the working copy
# is deleted before the job ends — so it is never in a chat, an email, or a phone's downloads.
#
# The trade that buys: a secret cannot be read back out. GitHub is the only copy. If it is ever
# lost, the app cannot be updated in place again and has to be reinstalled once under a new key —
# recoverable, but only by asking everyone to reinstall. For a hand-distributed app that is the
# right side of the trade; for a Play Store listing, use Play App Signing instead.

on:
  workflow_dispatch:

# The default token is not used and is given nothing: writing secrets needs the PAT below, and a
# workflow that can write secrets should not also be able to write code.
permissions: {}

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check what is already here
        env:
          EXISTING: ${{ secrets.KEYSTORE_BASE64 }}
          PAT: ${{ secrets.BOOTSTRAP_PAT }}
        run: |
          if [ -n "$EXISTING" ]; then
            echo "::error::KEYSTORE_BASE64 is already set. Refusing to replace it." >&2
            echo "A new key would not install over the builds the old one signed, so replacing" >&2
            echo "it is a decision to make deliberately: delete the secret by hand first." >&2
            exit 1
          fi
          if [ -z "$PAT" ]; then
            echo "::error::Set the BOOTSTRAP_PAT secret first — see docs/SIGNING.md." >&2
            exit 1
          fi

      - name: Generate the key and store it as secrets
        env:
          GH_TOKEN: ${{ secrets.BOOTSTRAP_PAT }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail

          # 32 alphanumeric characters. Symbols buy nothing here and cost quoting trouble in
          # keytool and Gradle.
          PASS="$(LC_ALL=C tr -dc 'A-Za-z0-9' < /dev/urandom | head -c 32)"
          # Masked before it is used anywhere, so a failing command cannot echo it into the log.
          echo "::add-mask::$PASS"

          # PKCS12 — the modern default — does not support a key password that differs from the
          # store password; it silently ignores the second one. So both are deliberately the same,
          # and both secrets below carry that one value.
          keytool -genkeypair \
            -keystore keystore.jks \
            -alias deckwatch \
            -keyalg RSA -keysize 4096 -validity 10000 \
            -storepass "$PASS" -keypass "$PASS" \
            -dname "CN=DeckWatch, O=DeckWatch, C=TR"

          B64="$(base64 -w0 keystore.jks)"
          echo "::add-mask::$B64"

          gh secret set KEYSTORE_BASE64 --repo "$REPO" --body "$B64"
          gh secret set KEYSTORE_PASSWORD --repo "$REPO" --body "$PASS"
          gh secret set KEY_ALIAS --repo "$REPO" --body "deckwatch"
          gh secret set KEY_PASSWORD --repo "$REPO" --body "$PASS"

          # The fingerprint is safe to print and is the only thing worth keeping from this run: it
          # is what a future build's APK signature can be checked against.
          # Never fatal: the secrets are already written by this point, and a job that goes red
          # after succeeding would read as "it did not work" and invite a second run.
          echo "Stored. The certificate this key will sign with:"
          keytool -list -v -keystore keystore.jks -storepass "$PASS" -alias deckwatch 2>/dev/null \
            | grep -E 'SHA256:|Valid from' || echo "  (fingerprint unavailable — the secrets are set regardless)"

          shred -u keystore.jks 2>/dev/null || rm -f keystore.jks

      - name: What to do next
        run: |
          echo "The signing secrets are set. Now:"
          echo "  1. Delete the BOOTSTRAP_PAT secret and revoke the token — it is not needed again."
          echo "  2. Push anything to main, or re-run the Release workflow."
          echo "  3. Install that build. It is the last one that needs an uninstall first;"
          echo "     every build after it installs straight over the top."
