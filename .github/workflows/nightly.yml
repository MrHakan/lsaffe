name: Nightly

on:
  schedule:
    - cron: '30 2 * * *'
  workflow_dispatch:

jobs:
  nightly:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v6

      - name: Build nightly debug APK
        run: ./gradlew :app:assembleDebug --stacktrace

      - name: Date stamp
        id: date
        run: echo "today=$(date +%Y%m%d)" >> "$GITHUB_OUTPUT"

      - name: Upload nightly artifact
        uses: actions/upload-artifact@v7
        with:
          name: deckwatch-nightly-${{ steps.date.outputs.today }}
          path: app/build/outputs/apk/**/debug/*.apk
          retention-days: 7

  # The emulator suite runs here rather than on every pull request. There are no instrumented
  # tests in the tree yet (`src/androidTest` does not exist in any module), so on a pull request it
  # booted two emulators to run zero tests and reported failure — twice, on every push. Nightly is
  # where it belongs until the suite of §15 exists; then it can move back into the merge gate.
  instrumented:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    continue-on-error: true
    strategy:
      matrix:
        api-level: [ 26, 34 ]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v6

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules && sudo udevadm trigger --name-match=kvm

      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api-level }}
          arch: x86_64
          disable-animations: true
          script: ./gradlew connectedDebugAndroidTest
