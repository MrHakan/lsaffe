name: Release

on:
  push:
    tags: [ 'v*.*.*' ]
    # Every push to main cuts its own release: a version, a tag and an APK, with no hand tagging.
    branches: [ main ]
  workflow_dispatch:
    inputs:
      version:
        description: 'Version (e.g. 1.2.0)'
        required: true
      prerelease:
        description: 'Mark as pre-release'
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Derive version
        id: ver
        run: |
          CODE="$(git rev-list --count HEAD)"
          case "${{ github.event_name }}" in
            workflow_dispatch)
              V="${{ inputs.version }}"
              TAG="v$V"
              PRERELEASE="${{ inputs.prerelease }}"
              NAME="DeckWatch v$V"
              ;;
            push)
              if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
                V="${GITHUB_REF_NAME#v}"
                TAG="$GITHUB_REF_NAME"
                PRERELEASE=false
                NAME="DeckWatch v$V"
              else
                # One release per commit on main. The patch number is the commit count, so it only
                # ever goes up — a random number would make it impossible to tell which build on
                # the Releases page is the newer one.
                V="0.1.$CODE"
                TAG="v$V"
                PRERELEASE=false
                NAME="DeckWatch v$V"
              fi
              ;;
          esac
          {
            echo "version=$V"
            echo "versionCode=$CODE"
            echo "tag=$TAG"
            echo "prerelease=$PRERELEASE"
            echo "name=$NAME"
            echo "asset=DeckWatch-$V"
          } >> "$GITHUB_OUTPUT"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v6

      - name: Decode keystore
        env:
          KEYSTORE_B64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "KEYSTORE_PATH=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
          else
            # Loud, because the build still succeeds and the APK still installs on a clean phone —
            # it just will not install *over* the last one, and that is discovered by an officer
            # losing their register rather than by anyone reading this log.
            echo "::warning::KEYSTORE_BASE64 is not set. This build is signed with a throwaway" \
                 "debug key, so it will NOT install over an existing DeckWatch. See docs/SIGNING.md."
          fi

      - name: Quality gate
        run: ./gradlew ktlintCheck detekt testReleaseUnitTest test --stacktrace

      - name: Build signed APK and AAB
        env:
          # Only the keystore itself is a secret. Its password is not, and putting it here rather
          # than in a fourth secret is deliberate: a password guards a keystore *file*, and this
          # file exists nowhere but in KEYSTORE_BASE64. Anyone who can read this password cannot
          # reach the file, and anyone who has the file did not need the password from here. One
          # secret to set is worth more than the appearance of protecting a value that guards
          # nothing on its own.
          KEYSTORE_PASSWORD: DeckWatchRelease2026KeystorePass
          KEY_ALIAS: deckwatch
          KEY_PASSWORD: DeckWatchRelease2026KeystorePass
          VERSION_NAME: ${{ steps.ver.outputs.version }}
          VERSION_CODE: ${{ steps.ver.outputs.versionCode }}
        run: |
          # Both builds are unsplit. The APK because the Releases page ships one universal file
          # (see the collect step), and the bundle because ABI splits and resource shrinking
          # cannot run together — the pre-bundle step expects a single shrunk-resources file.
          # Play derives its own per-device splits from the bundle either way.
          ./gradlew :app:assembleRelease -Pdeckwatch.noSplits --stacktrace
          ./gradlew :app:bundleRelease -Pdeckwatch.noSplits --stacktrace

      - name: Collect artifacts and checksums
        run: |
          mkdir -p dist
          A="${{ steps.ver.outputs.asset }}"
          # One APK: the app ships a single universal APK, so the officer downloading it from the
          # Releases page never has to pick an ABI.
          cp app/build/outputs/apk/release/app-release.apk "dist/${A}.apk"
          cp app/build/outputs/bundle/release/app-release.aab "dist/${A}.aab"
          cd dist
          sha256sum * > SHA256SUMS.txt

      - name: Generate release notes
        run: |
          PREV=$(git describe --tags --abbrev=0 --match 'v*' HEAD^ 2>/dev/null || echo "")
          { echo "## What's changed"; echo
            if [ -n "$PREV" ]; then git log --pretty='- %s (%h)' "$PREV..HEAD";
            else git log --pretty='- %s (%h)' -20; fi
            echo; echo "Commit: \`${GITHUB_SHA}\`"
            echo; echo "### Checksums"; echo '```'; cat dist/SHA256SUMS.txt; echo '```'
          } > CHANGELOG_RELEASE.md

      # The tag this creates does not start the workflow again: events raised with the default
      # GITHUB_TOKEN never trigger further workflow runs. Swapping in a personal access token here
      # would turn every release into an endless chain of them.
      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.ver.outputs.tag }}
          name: ${{ steps.ver.outputs.name }}
          body_path: CHANGELOG_RELEASE.md
          prerelease: ${{ steps.ver.outputs.prerelease }}
          files: dist/*
          fail_on_unmatched_files: true
          # The newest build is the one to install, so it takes the "Latest release" badge.
          make_latest: true
