name: Release

on:
  push:
    tags: [ 'v*.*.*' ]
    # Every push to main publishes a build to the rolling "main" pre-release, so the Releases page
    # always carries an installable APK of the current main without anyone tagging by hand.
    branches: [ main ]
  workflow_dispatch:
    inputs:
      version:
        description: 'Version (e.g. 1.2.0)'
        required: true
      prerelease:
        description: 'Mark as pre-release'
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Derive version
        id: ver
        run: |
          CODE="$(git rev-list --count HEAD)"
          ASSET=""
          case "${{ github.event_name }}" in
            workflow_dispatch)
              V="${{ inputs.version }}"
              TAG="v$V"
              PRERELEASE="${{ inputs.prerelease }}"
              NAME="DeckWatch v$V"
              ;;
            push)
              if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
                V="${GITHUB_REF_NAME#v}"
                TAG="$GITHUB_REF_NAME"
                PRERELEASE=false
                NAME="DeckWatch v$V"
              else
                # Rolling build of main: one release that is replaced on every push.
                V="0.1.0-main.$CODE"
                TAG="main"
                PRERELEASE=true
                NAME="DeckWatch — latest main build"
                # Fixed asset names: the rolling release is republished on every push, and a
                # versioned name would leave the previous build's APK sitting beside the new one.
                ASSET="DeckWatch-main"
              fi
              ;;
          esac
          {
            echo "version=$V"
            echo "versionCode=$CODE"
            echo "tag=$TAG"
            echo "prerelease=$PRERELEASE"
            echo "name=$NAME"
            echo "asset=${ASSET:-DeckWatch-$V}"
          } >> "$GITHUB_OUTPUT"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v6

      - name: Decode keystore
        env:
          KEYSTORE_B64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "KEYSTORE_PATH=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
          else
            echo "No KEYSTORE_BASE64 secret set — release build will use the debug keystore." >&2
          fi

      - name: Quality gate
        run: ./gradlew ktlintCheck detekt testReleaseUnitTest test --stacktrace

      - name: Build signed APK and AAB
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          VERSION_NAME: ${{ steps.ver.outputs.version }}
          VERSION_CODE: ${{ steps.ver.outputs.versionCode }}
        run: ./gradlew :app:assembleRelease :app:bundleRelease --stacktrace

      - name: Collect artifacts and checksums
        run: |
          mkdir -p dist
          A="${{ steps.ver.outputs.asset }}"
          # One APK: the app ships a single universal APK, so the officer downloading it from the
          # Releases page never has to pick an ABI.
          cp app/build/outputs/apk/release/app-release.apk "dist/${A}.apk"
          cp app/build/outputs/bundle/release/app-release.aab "dist/${A}.aab"
          cd dist
          sha256sum * > SHA256SUMS.txt

      - name: Generate release notes
        run: |
          PREV=$(git describe --tags --abbrev=0 --exclude=main HEAD^ 2>/dev/null || echo "")
          { echo "## What's changed"; echo
            if [ -n "$PREV" ]; then git log --pretty='- %s (%h)' "$PREV..HEAD";
            else git log --pretty='- %s (%h)' -20; fi
            echo; echo "Commit: \`${GITHUB_SHA}\`"
            echo; echo "### Checksums"; echo '```'; cat dist/SHA256SUMS.txt; echo '```'
          } > CHANGELOG_RELEASE.md

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.ver.outputs.tag }}
          name: ${{ steps.ver.outputs.name }}
          body_path: CHANGELOG_RELEASE.md
          prerelease: ${{ steps.ver.outputs.prerelease }}
          files: dist/*
          fail_on_unmatched_files: true
